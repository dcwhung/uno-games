name: Deploy

# ---------------------------------------------------------------------------------------------
# Production deploy to Vercel, triggered by pushing a version tag (v*).
#
# THIS PIPELINE DOES NOT WORK UNTIL THE REPO SECRETS ARE SET. It fails fast (first step) with a
# named list of what is missing. One-time setup, in GitHub -> Settings -> Secrets and variables
# -> Actions -> New repository secret:
#
#   VERCEL_TOKEN       Vercel account token   (Vercel -> Account Settings -> Tokens)
#   VERCEL_ORG_ID      team / user id         (.vercel/project.json after `vercel link`)
#   VERCEL_PROJECT_ID  project id             (.vercel/project.json after `vercel link`)
#
# Optional repo VARIABLE (not a secret) -- the public production URL, e.g. https://uno-games.vercel.app.
# When set, the smoke test also checks the live alias, not just the fresh deployment URL:
#
#   PRODUCTION_URL
#
# Step-by-step setup, environment matrix and the rollback procedure: docs/environments.md
#
# HOW IT WORKS
#   Two jobs. `quality` re-runs the blocking gates (lint / typecheck / test / engine coverage /
#   prod-dependency audit) because a tag can sit on a commit that never went through ci.yml;
#   `deploy` has `needs: quality`, so nothing is built or uploaded until they are green. The
#   header comment on the `quality` job explains which ci.yml gates are deliberately left out.
#
#   The app is built HERE with pnpm, then shipped to Vercel as a *prebuilt* deployment
#   (Build Output API v3). Vercel never runs a second build, so the artifact that passed this
#   job's build step is byte-for-byte the artifact that goes live.
#
#   Because of that, Vercel never reads `vercel.json` during this deploy -- it reads
#   `.vercel/output/config.json`. S-067: that file is GENERATED from `vercel.json` by
#   scripts/vercel-build-output.mjs, so the SPA fallback has exactly one source of truth and
#   there is nothing to keep in sync by hand. Routing that the generator cannot translate
#   fails the deploy rather than being silently dropped. See docs/environments.md.
#
#   Vercel's Git integration must stay OFF (`vercel.json` -> "github": { "enabled": false },
#   plus the dashboard toggle) or every tag push would deploy twice, racing this job.
#
#   `workflow_dispatch` only appears in the Actions UI once this file is on the default
#   branch. A manual run deploys the checked-out ref as-is, which is the escape hatch for
#   re-running a failed tag deploy without cutting a new tag.
# ---------------------------------------------------------------------------------------------

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

# Least privilege: this workflow only reads the repo. It creates no release, writes no
# comment, pushes no tag. Deploy credentials come from Vercel secrets, not GITHUB_TOKEN.
permissions:
    contents: read

# One production deploy at a time. Never cancel in flight -- a half-uploaded deployment is
# worse than a queued one, and Vercel deployments are cheap but not free to interrupt.
concurrency:
    group: deploy-production
    cancel-in-progress: false

# W-045: ONLY non-secret values belong at workflow level -- a workflow-level `env` is injected
# into every step, so a credential here would also be readable by `pnpm install` (any dependency's
# postinstall script) and by the build (any Vite plugin). The three Vercel secrets are attached
# per-step instead, to the steps that actually talk to Vercel. Do not move them back up here.
env:
    # Pinned major tag, same policy as ci.yml's actions (@v4): predictable, still gets patches.
    VERCEL_CLI_VERSION: '59'

jobs:
    # ---------------------------------------------------------------------------------------------
    # W-047: `on.push.tags: ['v*']` fires for a tag on ANY commit, and `workflow_dispatch` can
    # target any ref -- neither has necessarily ever been through ci.yml. Before this job existed
    # the only thing standing between a tag and production was the `tsc -p .` inside `vite build`,
    # plus a sentence in docs/environments.md asking people to tag "after CI is green". That is a
    # human-discipline gate, not a gate.
    #
    # This job is deliberately NOT a copy of ci.yml. It runs the gates whose failure means the
    # artifact is wrong, and leaves out the ones whose failure only means the repo is untidy:
    #
    #   run here | pnpm lint          -- the ONLY enforcement of CLAUDE.md rule 1 (engine purity:
    #            |                       no-restricted-globals blocks Date / Math.random / timers
    #            |                       inside packages/engine, all at `error`), plus
    #            |                       react-hooks/rules-of-hooks + exhaustive-deps at `error`.
    #            |                       Both classes are runtime-correctness rules, not style.
    #   run here | pnpm typecheck     -- covers BOTH packages and their specs. `vite build` only
    #            |                       runs `tsc -p .` for packages/app.
    #   run here | pnpm test          -- 92 engine + 111 app. The strongest single guard there is.
    #   run here | engine test:cov    -- the lines >= 99 threshold is the tamper-detector for the
    #            |                       line above: deleting or skipping engine specs to get a
    #            |                       green run trips this even when `pnpm test` stays green.
    #   run here | audit (prod deps)  -- the only advisories that can reach a user's browser.
    #
    #   NOT here | pnpm format:check  -- prettier output has zero runtime effect (proven in this
    #            |                       repo by AST + esbuild byte comparison of c62490c). Failing
    #            |                       a production deploy on indentation is how gates get
    #            |                       bypassed mid-incident. Stays blocking in ci.yml.
    #   NOT here | audit (all deps)   -- devDependency advisories cannot reach the shipped bundle
    #            |                       (react / three / zustand only), and it is a live registry
    #            |                       call: a registry hiccup would block a rollback-by-redeploy
    #            |                       for a risk that is not in production. Stays blocking in ci.yml.
    #   NOT here | pnpm build         -- the deploy job builds anyway, and it fails there before
    #            |                       anything is uploaded. Building twice buys nothing.
    #
    # Duplicated from ci.yml for now; extract a `workflow_call` reusable workflow if a third
    # caller appears.
    # ---------------------------------------------------------------------------------------------
    quality:
        name: lint / typecheck / test / coverage / audit
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            # --frozen-lockfile is itself a gate: a tag whose lockfile drifted from its manifests
            # would install something nobody reviewed.
            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Type check
              run: pnpm typecheck

            - name: Unit tests
              run: pnpm test

            - name: Engine coverage
              run: pnpm --filter @uno/engine test:cov

            - name: Security scan (prod deps, blocking)
              run: pnpm audit --prod --audit-level=moderate

    deploy:
        # W-047: nothing is built or uploaded until every gate above is green.
        needs: quality
        name: build / deploy / smoke (production)
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: production
        steps:
            # Fail in ~5s with a readable message rather than 3 minutes in with a Vercel CLI stack trace.
            - name: Verify required secrets are present
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
              run: |
                  missing=''
                  [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
                  [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
                  [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
                  if [ -n "$missing" ]; then
                    echo "::error::Missing repository secret(s):$missing -- see docs/environments.md (One-time setup)."
                    exit 1
                  fi
                  echo "All three Vercel secrets are set."

            - name: Checkout
              uses: actions/checkout@v4

            # Reads the pnpm version from root package.json "packageManager" (no explicit version here).
            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            # Reads the Node version from .nvmrc; caches the pnpm store between runs.
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            # Official CLI, pinned major. Deliberately NOT a third-party deploy action: this keeps the
            # supply chain for a credential-bearing step down to one first-party package.
            - name: Install Vercel CLI
              run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

            # Validates the token / org / project triple before spending time on install + build.
            # The Vercel CLI reads the credentials from the environment, so the token never appears
            # in an argv that shows up in process listings or step logs.
            #
            # S-070: `vercel pull` writes TWO kinds of file into .vercel/ -- project.json (ids, which
            # the deploy step needs) and .env.*.local (the project's runtime environment variables,
            # pulled from Vercel). Only the first is needed downstream: a prebuilt static deploy
            # never reads the pulled env files. They are deleted here rather than left sitting in
            # the workspace for the whole of `pnpm install` and the build. The file is empty today
            # (docs/environments.md: "The app currently has no runtime environment variables"), but
            # that document also says what happens when the first one is added -- and on that day
            # nobody will come back and re-read this step.
            - name: Link project and pull production settings
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
              run: |
                  set -euo pipefail
                  vercel pull --yes --environment=production
                  rm -f .vercel/.env.*.local

            # W-045: no Vercel credentials in this step's environment. The three secrets are not in
            # it, and S-070 removed the pulled .env.*.local files before this step runs, so a
            # malicious postinstall script in the dependency tree has neither the token nor the
            # project's environment variables to read.
            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # W-045: likewise no credentials -- a compromised Vite plugin cannot read the token.
            - name: Build app
              run: pnpm --filter @uno/app build

            # Vercel Build Output API v3. `static/` is served as-is; `config.json` supplies routing.
            # S-067: config.json is GENERATED from vercel.json by scripts/vercel-build-output.mjs,
            # so the SPA fallback is declared once. The script refuses to run -- it does not guess --
            # if vercel.json grows routing it cannot translate (redirects / headers / cleanUrls /
            # trailingSlash / raw routes), so drift fails the deploy instead of silently shipping
            # routing that differs from what `vercel build` would produce locally.
            # W-050: that refusal now covers the fields inside a rewrite as well, not just the
            # top-level keys -- a rewrite with no `destination`, or one carrying a `has` condition,
            # used to exit 0 and ship a config that both smoke gates below would have passed.
            - name: Assemble Vercel prebuilt output from packages/app/dist
              run: |
                  set -euo pipefail
                  test -f packages/app/dist/index.html \
                    || { echo "::error::packages/app/dist/index.html not found -- did the build change its outDir?"; exit 1; }
                  node scripts/vercel-build-output.mjs
                  mkdir -p .vercel/output/static
                  cp -R packages/app/dist/. .vercel/output/static/
                  echo "Prebuilt output:"
                  find .vercel/output/static -maxdepth 2 -type f | head -20

            - name: Deploy to production
              id: deploy
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
              run: |
                  set -euo pipefail
                  url="$(vercel deploy --prebuilt --prod --yes)"
                  case "$url" in
                    https://*) ;;
                    *) echo "::error::Vercel CLI did not return a deployment URL (got: '$url')"; exit 1 ;;
                  esac
                  echo "url=$url" >> "$GITHUB_OUTPUT"
                  echo "Deployed: $url"

            # Smoke gate: a non-2xx here means the deploy is broken and must be rolled back
            # (docs/environments.md -> Rollback). The retry loop covers Vercel's brief propagation
            # window.
            # NOTE: if Vercel Deployment Protection (Vercel Authentication) is enabled for production,
            # this URL answers 401 and the gate fails. Either leave production public or configure a
            # protection bypass -- see docs/environments.md.
            # S-064: values reach the shell as environment variables, never as `${{ }}` text pasted
            # into the script body -- a tag name may legally contain `$( )`, which would otherwise be
            # command-substituted inside the double quotes.
            # S-063: `-f` is gone. It made curl exit non-zero on any non-2xx before `%{http_code}`
            # could be printed, so the echo could only ever report a success code. Asserting the code
            # explicitly means a 401 from Deployment Protection is visible in the log.
            # S-073: dropping `-f` also narrowed what got retried, because `--retry-all-errors` only
            # fires on what curl itself considers an error and a 4xx stops being one. Measured against
            # a local server with `--retry 2 --retry-delay 2 --retry-all-errors`: a 404 retried twice
            # (4s) with `-f` and zero times (0.07s) without it; a 503 retried either way. A 404 is
            # exactly what an alias still propagating returns, so the retry policy is now an explicit
            # loop instead of a curl flag: one place to read, every wait logged, and 401/403 fails on
            # the first response because Deployment Protection will not resolve itself. `000` is
            # curl's code for "no response at all" (DNS / connection), which is also worth retrying.
            - name: Smoke test deployment URL
              env:
                  DEPLOY_URL: ${{ steps.deploy.outputs.url }}
              run: |
                  set -euo pipefail
                  max_attempts=5
                  retry_delay_seconds=5
                  code=''
                  for attempt in $(seq 1 "$max_attempts"); do
                    code="$(curl -sS -o /dev/null -w '%{http_code}' "$DEPLOY_URL" || true)"
                    case "$code" in
                      2??) break ;;
                      000 | 404 | 5??)
                        if [ "$attempt" -lt "$max_attempts" ]; then
                          echo "attempt $attempt/$max_attempts: HTTP $code -- still propagating, retrying in ${retry_delay_seconds}s"
                          sleep "$retry_delay_seconds"
                        fi
                        ;;
                      *) break ;;
                    esac
                  done
                  echo "Deployment URL responded $code"
                  case "$code" in
                    2??) ;;
                    401 | 403)
                      echo "::error::HTTP $code -- Vercel Deployment Protection is likely on for production; see docs/environments.md step 8."
                      exit 1
                      ;;
                    *) echo "::error::Smoke test failed with HTTP $code"; exit 1 ;;
                  esac

            # This is the check that actually proves the production alias moved to the new
            # deployment. S-062: the step now always runs. When PRODUCTION_URL is unset it emits a
            # ::warning:: and records the gap in the summary, instead of vanishing from a green job
            # and leaving a "successful" deploy in which the alias was never verified at all.
            # S-073: same retry loop as the step above, and this is the one that needs it most --
            # an alias moving is DNS / edge propagation, which is slower than a deployment URL
            # becoming reachable. Kept inline rather than shared: the two steps differ (this one is
            # conditional and writes a step output), and a shared shell script would be a third
            # place to keep in sync. If a third smoke target ever appears, extract it then.
            - name: Smoke test production alias
              id: alias
              env:
                  PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
              run: |
                  set -euo pipefail
                  if [ -z "$PRODUCTION_URL" ]; then
                    echo "::warning::PRODUCTION_URL repo variable is not set -- the production alias was NOT verified. See docs/environments.md step 7."
                    echo "checked=no" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  max_attempts=5
                  retry_delay_seconds=5
                  code=''
                  for attempt in $(seq 1 "$max_attempts"); do
                    code="$(curl -sS -o /dev/null -w '%{http_code}' "$PRODUCTION_URL" || true)"
                    case "$code" in
                      2??) break ;;
                      000 | 404 | 5??)
                        if [ "$attempt" -lt "$max_attempts" ]; then
                          echo "attempt $attempt/$max_attempts: HTTP $code -- alias still propagating, retrying in ${retry_delay_seconds}s"
                          sleep "$retry_delay_seconds"
                        fi
                        ;;
                      *) break ;;
                    esac
                  done
                  echo "Production alias responded $code"
                  case "$code" in
                    2??) ;;
                    401 | 403)
                      echo "::error::HTTP $code -- Vercel Deployment Protection is likely on for production; see docs/environments.md step 8."
                      exit 1
                      ;;
                    *) echo "::error::Alias smoke test failed with HTTP $code"; exit 1 ;;
                  esac
                  echo "checked=yes" >> "$GITHUB_OUTPUT"

            - name: Deploy summary
              env:
                  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
                  COMMIT_SHA: ${{ github.sha }}
                  DEPLOY_URL: ${{ steps.deploy.outputs.url }}
                  ALIAS_CHECKED: ${{ steps.alias.outputs.checked }}
              run: |
                  set -euo pipefail
                  if [ "$ALIAS_CHECKED" = 'yes' ]; then
                    alias_row='verified'
                  else
                    alias_row='**NOT verified** (PRODUCTION_URL repo variable is unset)'
                  fi
                  {
                    echo "### Production deploy"
                    echo ""
                    echo "| field | value |"
                    echo "| --- | --- |"
                    echo "| version | \`$VERSION\` |"
                    echo "| commit | \`$COMMIT_SHA\` |"
                    echo "| deployment | $DEPLOY_URL |"
                    echo "| production alias | $alias_row |"
                    echo ""
                    echo "Rollback: see \`docs/environments.md\`."
                  } >> "$GITHUB_STEP_SUMMARY"
