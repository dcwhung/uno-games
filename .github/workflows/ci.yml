name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# S-040: least privilege for GITHUB_TOKEN. This workflow only reads the repo; nothing here
# writes to the API (no PR comments, no releases, no deploy).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------------------------
# Gates NOT YET ENABLED (sw-ci-cd stage list vs this workflow). Each one is tied to a ticket so
# it is re-checked when that ticket closes; do not add a new deferred gate without an ID.
#
#   Gate                              | Status                   | Ticket   | Enable when
#   ----------------------------------|--------------------------|----------|---------------------------------
#   Format check (`pnpm format:check`)| commented-out below      | AU-016   | repo-wide `pnpm format` chore
#                                     |                          | follow-up| (tabWidth 4) lands
#   Security scan, full incl. devDeps | runs, continue-on-error  | AU-016   | vite >= 6.4.3 / vitest >= 3 /
#   (`pnpm audit --audit-level=high`) |                          |          | ajv-cli -> ajv clears 1 crit +
#                                     |                          |          | 2 high; then drop the
#                                     |                          |          | continue-on-error line
#   Smoke / E2E (scripts/smoke.mjs)   | commented-out below      | S-040    | global Playwright + preview
#                                     |                          |          | server on :4173 wired into CI
#   Action SHA pinning                | major tags (@v4) for now | S-040    | follow-up: pin to commit SHA
# ---------------------------------------------------------------------------------------------

jobs:
  ci:
    name: lint / typecheck / test / build / audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the pnpm version from root package.json "packageManager" (no explicit version here).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Reads the Node version from .nvmrc; caches the pnpm store between runs.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # NOT YET ENABLED (AU-016 follow-up): `pnpm format:check` fails today because the codebase is
      # 2-space while .prettierrc is tabWidth 4. Enable once the repo-wide `pnpm format` chore lands.
      # - name: Format check
      #   run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Engine coverage gate: vitest thresholds (lines >= 99) in packages/engine/vitest.config.ts.
      - name: Engine coverage
        run: pnpm --filter @uno/engine test:cov

      - name: Build app
        run: pnpm --filter @uno/app build

      # ---- Security scan (sw-ci-cd: Critical / High blocks) -------------------------------------
      # W-042: split into two steps so the gate is real today without being red on known debt.
      #
      # 1) BLOCKING — production dependencies only. Every known advisory lives in devDependencies
      #    (vite / vitest / esbuild / fast-json-patch, see AU-016), so this passes now and guards
      #    the code that actually ships (engine has zero runtime deps; app = react / three / zustand).
      - name: Security scan (prod deps, blocking)
        run: pnpm audit --prod --audit-level=high

      # 2) NON-BLOCKING — full tree incl. devDependencies. Red today: 1 critical + 2 high, all
      #    AU-016. Kept running (not commented out) so every CI log shows the current count and a
      #    regression in *new* devDeps is visible. When AU-016 lands, delete `continue-on-error`
      #    and this becomes a second blocking gate.
      - name: Security scan (all deps, non-blocking until AU-016)
        run: pnpm audit --audit-level=high
        continue-on-error: true

      # NOT YET ENABLED (S-040): scripts/smoke.mjs needs a global Playwright install + preview
      # server on :4173; wiring that into CI is a separate task.
